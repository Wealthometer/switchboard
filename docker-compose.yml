# Full stack:  cp .env.example .env  (set JWT_SECRET)  then  docker compose up -d --build
# App: http://localhost:8080   ·   Outgoing email (Mailpit): http://localhost:8025
# Demo data:  docker compose run --rm migrate node dist/scripts/seed-demo.js

x-api: &api
  build: { context: ., dockerfile: api/Dockerfile }
  image: switchboard-api
  restart: unless-stopped
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://switchboard:${POSTGRES_PASSWORD:-switchboard}@postgres:5432/switchboard
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
    APP_URL: ${APP_URL:-http://localhost:8080}
    CORS_ORIGIN: ${APP_URL:-http://localhost:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
    MAIL_FROM: ${MAIL_FROM:-Switchboard <support@switchboard.local>}
    AUTO_CLOSE_HOURS: ${AUTO_CLOSE_HOURS:-168}
  volumes: [uploads:/data/uploads]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-switchboard}
      POSTGRES_DB: switchboard
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["${MAILPIT_PORT:-8025}:8025"]

  migrate:
    <<: *api
    restart: "no"
    command: ["node", "dist/database/migrate.js"]
    healthcheck: { disable: true }

  api:
    <<: *api
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *api
    command: ["node", "dist/worker.js"]
    healthcheck: { disable: true }
    stop_grace_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: web/Dockerfile }
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  uploads:
