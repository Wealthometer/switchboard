# Render Blueprint: the API on Render's free plan, built from api/Dockerfile.
# The web app is deployed on Vercel (see web/vercel.json), PostgreSQL on Supabase and Redis on Upstash.
# Values marked sync: false are entered in the Render dashboard when you create the Blueprint.
#
# The free plan has no background workers and no pre-deploy command, so the API runs the worker
# (RUN_WORKER) and applies migrations when it starts (MIGRATE_ON_START). It also sleeps after
# 15 idle minutes: the first request then takes up to a minute, and scheduled jobs pause meanwhile.

services:
  - type: web
    name: switchboard-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt # Closest Render region to the database (Supabase eu-north-1, Stockholm).
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The Vercel URL people open, e.g. https://switchboard.vercel.app (used in email links).
      - key: APP_URL
        sync: false
      # Same value as APP_URL. Comma-separate to allow preview deployments too.
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Browser → Vercel → Render's load balancer → API. Two trusted hops give rate limits the real client IP.
      - key: TRUST_PROXY
        value: "2"
      # Real email. Without it emails are only logged, so portal links and invites never arrive.
      # Brevo: smtp://<login, with @ as %40>:<SMTP key>@smtp-relay.brevo.com:587
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Render's disk is wiped on each deploy, so attachments go to an S3-compatible bucket.
      # Supabase Storage: endpoint https://<project-ref>.storage.supabase.co/storage/v1/s3, region eu-north-1.
      - key: STORAGE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: RUN_WORKER
        value: "true"
      - key: MIGRATE_ON_START
        value: "true"
      # The API and its in-process worker each open up to this many connections (Supabase free pooler: ~15).
      - key: DB_POOL_MAX
        value: "5"
