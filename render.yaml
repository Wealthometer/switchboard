# Render Blueprint: the API and the background worker, built from api/Dockerfile.
# The web app is deployed on Vercel (see web/vercel.json), PostgreSQL on Supabase and Redis on Upstash.
# Values marked sync: false are entered in the Render dashboard when you create the Blueprint.

envVarGroups:
  - name: switchboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The Vercel URL people open, e.g. https://switchboard.vercel.app (used in email links).
      - key: APP_URL
        sync: false
      # Same value as APP_URL. Comma-separate to allow preview deployments too.
      - key: CORS_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      # Real email. Without it emails are only logged, so portal links and invites never arrive.
      # Brevo: smtp://<login, with @ as %40>:<SMTP key>@smtp-relay.brevo.com:587
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Render's disk is wiped on each deploy, so attachments go to an S3-compatible bucket.
      - key: STORAGE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # API + worker together must stay under the database's connection limit.
      - key: DB_POOL_MAX
        value: "5"

services:
  - type: web
    name: switchboard-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt # Closest Render region to the database (Supabase eu-north-1, Stockholm).
    healthCheckPath: /health
    preDeployCommand: node dist/database/migrate.js
    envVars:
      - fromGroup: switchboard
      # Browser → Vercel → Render's load balancer → API. Two trusted hops give rate limits the real client IP.
      - key: TRUST_PROXY
        value: "2"

  - type: worker
    name: switchboard-worker
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    plan: starter
    region: frankfurt # Closest Render region to the database (Supabase eu-north-1, Stockholm).
    envVars:
      - fromGroup: switchboard
