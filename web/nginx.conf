# Rendered by the nginx image's envsubst step (API_UPSTREAM).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 "ok"; }

  # Same origin for the API, so the session cookie never crosses origins.
  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Live updates (Socket.IO over WebSocket, with long-polling fallback).
  location /socket.io/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
